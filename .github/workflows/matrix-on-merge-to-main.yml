name: CI

on:
  push:
    branches:
      - main
  release:
    types:
      - prereleased
      - published
  workflow_dispatch:

jobs:
  matrix-tests:
    uses: scikit-package/release-scripts/.github/workflows/_matrix-no-codecov-on-merge-to-main.yml@v0
    with:
      project: cifkit
      c_extension: false
      # Start Xvfb so VTK/pyvista polyhedron tests do not segfault
      headless: true
