# Three tutorials: physical features (primary), multi-CIF statistics, OLED.
# API reference and Maintainers are expandable parents (chevron), same pattern
# as quantem.widget: no caption on those parts so the parent link is the label.
format: jb-book
root: intro
parts:
  - caption: Getting started
    chapters:
      - file: install
  - caption: Tutorials
    chapters:
      - file: tutorials/physical-features
        title: Parse physical features from a .cif
      - file: tutorials/statistics-many-cifs
        title: Statistics over many CIFs
      - file: tutorials/oled
        title: OLED (elemental data)
  - chapters:
      - file: api/index
        title: API reference
        sections:
          - file: api/cif
          - file: api/cif-ensemble
          - file: api/coordination
          - file: api/oliynyk
          - file: api/formula
          - file: api/element-sorter
          - file: api/sources
          - file: api/quick-reference
            title: Quick reference (LLM)
  - chapters:
      - file: maintainer/index
        title: Maintainers
        sections:
          - file: maintainer/release
            title: Changelog and release
